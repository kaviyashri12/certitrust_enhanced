<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login – CertiTrust</title>
    <style>
        :root { --primary: #6d28d9; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; width: 100%; max-width: 400px; border-radius: 20px; padding: 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        .logo { text-align: center; font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
        .logo span { color: var(--primary); }
        .sub { text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 32px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        input { width: 100%; padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.95rem; margin-bottom: 18px; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(109,40,217,0.15); }
        button { width: 100%; padding: 13px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #5b21b6; }
        .back { display: block; text-align: center; margin-top: 20px; color: #64748b; font-size: 0.875rem; text-decoration: none; }
        .error { background: #fee2e2; color: #991b1b; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 0.875rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">◆ <span>CertiTrust</span></div>
        <p class="sub">College Admin Portal</p>

        {% with messages = get_flashed_messages() %}
            {% for msg in messages %}
                <div class="error">{{ msg }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" required placeholder="admin" value="admin">
            <label>Password</label>
            <input type="password" name="password" required placeholder="••••••••">
            <button type="submit">Sign In</button>
        </form>
        <a href="{{ url_for('main.index') }}" class="back">← Back to Home</a>
    </div>
</body>
</html>
